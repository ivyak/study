<!doctype html>
<html lang="ja">
<head>
  <base href="./public/">
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src data:; connect-src 'self'">
  <title>ひとつ想起 · Recall Garden</title>
  <style>:root { color-scheme: light; --ink: #29394d; --muted: #7b7282; --green: #344a63; --paper: #f7e9e4; --line: #e9d8d4; --gold: #bb8936; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: linear-gradient(160deg, #f7ddd0, #ede3ed 65%, #dce4eb) fixed; color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; }
button { cursor: pointer; min-height: 46px; touch-action: manipulation; color: inherit; }
button:disabled { cursor: default; opacity: .48; }
button:focus-visible, input:focus-visible { outline: 3px solid #be943d; outline-offset: 3px; }
.shell { width: min(100%, 660px); height: 100vh; height: 100dvh; margin: auto; padding: max(12px, env(safe-area-inset-top)) 18px calc(86px + env(safe-area-inset-bottom)); position: relative; display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 5px 6px; flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 750; font-size: 15px; border: 0; background: none; padding: 0; white-space: nowrap; }
.brand-mark { font-size: 27px; color: #a56c7b; }
.header-end { display: flex; align-items: center; gap: 2px; }
.icon-button { border: 1px solid #ffffff80; background: #fff7ef80; padding: 11px; width: 44px; height: 44px; min-height: 44px; border-radius: 50%; display: grid; place-items: center; }
.icon-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.coins { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; white-space: nowrap; margin-right: 4px; }
.coin-dot { width: 17px; height: 17px; background: #ebcc83; border: 2px solid #d9b563; border-radius: 50%; display: inline-block; }
.eyebrow { margin: 6px 0 4px; color: var(--muted); font-size: 12px; letter-spacing: .08em; }
.course { margin: 0; font-size: 13px; color: var(--muted); }
.question-head { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.step { color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 6px; }
.dots i { display: block; width: 7px; height: 7px; background: #dfe4d9; border-radius: 50%; }
.dots i.done { background: #6f8a66; }
.dots i.current { background: #b69b60; }
.question { font-size: clamp(21px, 5.5vw, 27px); font-weight: 650; line-height: 1.8; margin: 18px 0 20px; min-height: 90px; overflow-wrap: anywhere; }
.math-text { overflow-x: auto; padding: 2px 0 7px; }
math { font-family: 'STIX Two Math', 'Cambria Math', math; }
math mo.math-overbar { transform: translateY(-.12em); }
.katex { white-space: nowrap; }
.helper { font-size: 13px; color: var(--muted); margin: 14px 0; }
.primary, .secondary { width: 100%; border-radius: 14px; padding: 14px 12px; border: 1px solid var(--line); font-weight: 650; }
.primary { background: var(--green); color: #fff; border-color: var(--green); }
.secondary { background: #f4e4e3; }
.quiet { border: 0; background: none; color: var(--muted); padding: 12px 8px; font-size: 13px; }
.center { text-align: center; }
.answer { background: #fffcf7; border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin: 0 0 20px; }
.answer .label { font-size: 11px; letter-spacing: .1em; color: var(--muted); margin: 0 0 9px; }
.answer-main { font-size: 21px; margin-bottom: 12px; }
.criterion { font-size: 13px; color: #71687a; }
.disclosure-body, .answer-reveal { overflow: hidden; }
.disclosure-content { display: flow-root; }
details { margin-top: 15px; font-size: 13px; }
summary { cursor: pointer; padding: 5px 0; color: var(--muted); min-height: 38px; }
.sources { color: var(--muted); font-size: 11px; margin-top: 12px; overflow-wrap: anywhere; }
.source-toggles { display: grid; gap: 10px; margin-top: 14px; }
.source-toggle { margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; background: #f6eeee; min-width: 0; }
.source-toggle > summary { min-height: 46px; padding: 10px 0; color: var(--green); font-weight: 650; }
.source-caption { font-size: 11px; color: var(--muted); margin: 0 0 8px; overflow-wrap: anywhere; }
.source-zoom-controls { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.source-zoom-controls button { min-width: 38px; min-height: 44px; border: 1px solid var(--line); border-radius: 9px; background: #fffcf7; padding: 6px; }
.source-zoom-controls input { flex: 1; min-width: 35px; width: 100%; accent-color: var(--green); }
.source-zoom-controls output { font-size: 11px; min-width: 35px; text-align: center; font-variant-numeric: tabular-nums; }
.source-viewport { max-height: 60vh; overflow: auto; background: #eeeee6; overscroll-behavior: contain; border-radius: 6px; }
.source-viewport img { display: block; width: 100%; max-width: none; height: auto; margin-inline: auto; }
.source-toggle .helper { font-size: 11px; }
.ratings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.reward-hint { color: #8a7849; font-size: 12px; text-align: center; margin-bottom: 8px; }
.notice { border: 1px solid #fff8ef; padding: 10px 13px; border-radius: 10px; font-size: 12px; margin-bottom: 16px; background: #fff6edc9; }
.status { flex-shrink: 0; font-size: 11px; color: #7d592f; line-height: 1.5; margin: 3px 4px 0; max-height: 50px; overflow: auto; }
.status:empty { display: none; }
h1.page-title { font-size: 27px; font-weight: 650; margin: 14px 0 8px; }
.lead { color: #7b7282; font-size: 14px; margin-top: 8px; }
.panel { background: #fffcf7; border: 1px solid var(--line); border-radius: 15px; padding: 17px; margin: 18px 0; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; font-size: 14px; }
input[type='checkbox'] { width: 23px; height: 23px; accent-color: var(--green); }
input[type='time'] { max-width: 135px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; color: var(--ink); background: white; }
.stack { display: grid; gap: 10px; }
.badge { display: inline-block; padding: 3px 9px; font-size: 11px; color: #8a6679; background: #f1e1e1; border-radius: 10px; }
@media (max-width: 360px) {
  .shell { padding-left: 16px; padding-right: 16px; }
  .brand { font-size: 13px; }
  .icon-button { padding: 6px; }
  .question { font-size: 21px; }
  #content { padding: 21px 16px; }
}
/* The landscape and navigation are drawn locally and remain available offline. */
.landscape { position: absolute; inset: 0 0 auto; height: 300px; overflow: hidden; pointer-events: none; }
.landscape svg { width: 100%; height: 100%; display: block; }
.scroll-region { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch; border: 0; border-radius: 26px; background: #fff9f3f5; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, rgb(0 0 0 / var(--fade-top, 1)), #000 14px, #000 calc(100% - 18px), rgb(0 0 0 / var(--fade-bottom, 1))); mask-image: linear-gradient(to bottom, rgb(0 0 0 / var(--fade-top, 1)), #000 14px, #000 calc(100% - 18px), rgb(0 0 0 / var(--fade-bottom, 1))); }
.scroll-region.has-more-above { --fade-top: 0; }
.scroll-region.has-more-below { --fade-bottom: 0; }
.scroll-region::-webkit-scrollbar { display: none; }
.scroll-region:focus-visible { outline: 2px solid #a56c7b; outline-offset: 2px; }
.stretch-content { min-height: 100%; transform-origin: center top; }
#content { position: relative; padding: 22px 20px 26px; min-width: 0; }
.shell > .notice { flex-shrink: 0; padding: 6px 10px; margin-bottom: 6px; font-size: 10px; }
.notice { font-size: 11px; margin-bottom: 12px; backdrop-filter: blur(12px); }
.primary { box-shadow: 0 5px 12px #2b40571a; }
.primary, .secondary { border-radius: 18px; }
.main-nav { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(calc(100% - 28px), 608px); z-index: 20; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; padding: 6px 9px; border: 1px solid #ffffff30; border-radius: 22px; background: #293d55f5; box-shadow: 0 12px 30px #26334630; backdrop-filter: blur(18px); }
.main-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; min-height: 52px; border: 0; border-radius: 18px; color: #d1ccdb; background: none; font-size: 10px; padding: 3px 2px; transition: color .22s ease, background .22s ease, transform .22s ease; }
.main-nav svg { display: block; width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.main-nav button[aria-current='page'] { color: #ffddce; background: #ffffff13; font-weight: 650; }
.main-nav button:active { transform: scale(.94); }
.result-badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 20px; }
.result-badge.correct { color: #287552; background: #e4f0e8; }
.result-badge.mistake { color: #b34956; background: #f9e5e5; }
.result-badge strong { color: inherit; }
.result-symbol { font-size: 20px; line-height: 1.3; font-weight: 600; }
.count-presented { display: inline-flex; align-items: center; gap: 5px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.month-nav h2, .lesson h2 { font-size: 17px; margin: 0; font-weight: 650; }
.month-nav button { background: #f4e4e3; border: 0; border-radius: 10px; min-width: 44px; font-size: 24px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.weekday { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 8px; }
.calendar-day { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 54px; padding: 3px 0; border: 1px solid transparent; border-radius: 9px; background: #f7eeea; font-size: 13px; }
.calendar-day small { min-height: 1.5em; font-size: 9px; line-height: 1.5; overflow-wrap: anywhere; }
.calendar-day.has-answers { background: #e9d4d5; color: #744e63; }
.calendar-day.is-today { border-color: #bd929c; }
.calendar-day[aria-pressed='true'] { background: var(--green); color: white; border-color: var(--green); }
.subject-field { display: grid; gap: 7px; margin: 22px 0 12px; font-size: 13px; }
.subject-picker { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-width: 0; min-height: 50px; text-align: left; font-size: 15px; color: var(--ink); border: 1px solid var(--line); background: #fffcf7; border-radius: 13px; padding: 12px 14px; }
.subject-picker svg, .subject-options svg { flex-shrink: 0; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.subject-picker > svg { color: var(--muted); transition: transform .18s ease; }
.subject-picker[aria-expanded='true'] { border-color: #a68795; }
.subject-picker[aria-expanded='true'] > svg { transform: rotate(180deg); }
.subject-options { position: fixed; z-index: 100; overflow-y: auto; overscroll-behavior: contain; padding: 6px; border: 1px solid var(--line); border-radius: 16px; background: #fffcf7; box-shadow: 0 12px 35px #29394d24; -webkit-overflow-scrolling: touch; }
.subject-options[hidden] { display: none; }
.subject-options [role='option'] { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 46px; padding: 10px 12px; border: 0; border-radius: 10px; background: none; text-align: left; font-size: 14px; }
.subject-options [aria-selected='true'] { color: var(--green); background: #f4e4e3; font-weight: 650; }
.subject-options [role='option']:hover, .subject-options [role='option']:focus-visible { background: #f5eeea; outline: 2px solid #b99ba8; outline-offset: -2px; }
.lesson { margin-top: 24px; min-width: 0; }
.lesson-start { background: #f2dedc; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; }
.quiz-start { margin-top: 24px; }
.subject-start { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 4px; }
.quiz-scope { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 12px; }
.quiz-scope .quiet { padding: 4px 0; font-size: 11px; }
.lesson-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.lesson-card { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 8px; min-width: 0; padding: 16px 13px; border: 1px solid var(--line); border-radius: 17px; background: #fffcf7; font-size: 12px; overflow-wrap: anywhere; }
.lesson-card-number { font-size: 19px; font-weight: 650; }
.lesson-card small { color: var(--muted); margin-top: auto; }
.catalog-back { display: grid; place-items: center; width: 44px; height: 44px; min-height: 44px; padding: 10px; margin-left: -10px; border: 0; background: none; color: var(--muted); }
.catalog-back svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.catalog-question { background: #fffcf7; border: 1px solid var(--line); border-radius: 13px; padding: 12px; margin: 10px 0; }
.catalog-question > summary { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; color: var(--ink); padding: 0; }
.question-number { color: var(--muted); font-size: 12px; padding-top: 5px; }
.catalog-prompt { font-size: 15px; overflow-wrap: anywhere; }
.question-counts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 11px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
.catalog-question summary .question-counts { grid-column: 2; margin: 0; }
.question-counts strong { color: var(--ink); font-weight: 600; }
.catalog-answer { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; font-size: 15px; }
.catalog-answer .label { color: var(--muted); font-size: 11px; margin: 0 0 5px; }
.retired-question { padding: 10px 0; border-top: 1px solid var(--line); }
.retired-question p { margin: 0; }
.retired-question small { overflow-wrap: anywhere; }

@media (max-width: 360px) {
  #content { padding: 20px 14px; }
  .panel { padding: 12px; }
  .calendar-grid { gap: 3px; }
  .calendar-day { min-height: 46px; }
  .question-counts { gap: 6px 8px; }
}

@media (max-height: 760px) {
  h1.page-title { font-size: 24px; }
}
/* The garden is a viewport-sized scene; only the shop sheet scrolls. */
.garden-mode .landscape { display: none; }
.garden-mode .shell { width: 100%; pointer-events: none; }
.garden-mode header { position: relative; z-index: 5; pointer-events: auto; width: min(100%, 620px); margin-inline: auto; }
.garden-mode .header-end { background: #fff8eac9; border-radius: 26px; padding-left: 12px; backdrop-filter: blur(12px); }
.garden-mode .brand { text-shadow: 0 1px 12px #fff4dd; }
.garden-mode .scroll-region { position: fixed; inset: 0; border-radius: 0; background: transparent; overflow: hidden; mask-image: none; -webkit-mask-image: none; pointer-events: auto; }
.garden-mode .stretch-content, .garden-mode #content { height: 100%; min-height: 0; padding: 0; }
.garden-mode .status { position: fixed; bottom: calc(83px + env(safe-area-inset-bottom)); left: 22px; right: 120px; z-index: 7; color: #354b48; padding: 5px 10px; background: #fff9e9d9; border-radius: 10px; }
.garden-stage { position: absolute; inset: 0; overflow: hidden; background: #c9cdab; }
.garden-landscape { display: block; width: 100%; height: 100%; }
.garden-caption { position: absolute; top: calc(92px + env(safe-area-inset-top)); left: max(25px, calc((100vw - 580px) / 2)); color: #384f50; pointer-events: none; }
.garden-caption .eyebrow { color: #7f7b70; font-size: 9px; letter-spacing: .18em; }
.garden-caption h1 { font-size: 30px; font-weight: 600; letter-spacing: .08em; line-height: 1.3; margin: 7px 0 9px; }
.garden-caption p:last-child { margin: 0; font-size: 11px; color: #68796d; }
.garden-residents { position: absolute; inset: 0; }
.garden-animal { position: absolute; left: var(--x); top: var(--y); width: var(--size); height: var(--size); transform: translate(-50%, -50%); border: 0; padding: 0; min-height: 0; background: transparent; -webkit-tap-highlight-color: transparent; }
.animal-rabbit { --x: 27%; --y: 65%; --size: clamp(110px, 36vw, 170px); }
.animal-fox { --x: 70%; --y: 56%; --size: clamp(140px, 44vw, 210px); }
.animal-deer { --x: 40%; --y: 44%; --size: clamp(145px, 46vw, 220px); }
.animal-shadow { position: absolute; bottom: 8%; left: 23%; width: 54%; height: 7%; border-radius: 50%; background: #4d65543b; filter: blur(3px); }
.animal-roam, .animal-body { display: block; width: 100%; height: 100%; transform-origin: center 92%; }
.animal-body img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 4px 3px #5b60471a); }
.animal-name { display: block; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #fffaeae8; color: #46564e; opacity: 0; pointer-events: none; }
.animal-rabbit .animal-roam { animation: rabbit-hop 9s ease-in-out infinite; }
.animal-rabbit .animal-body { animation: animal-breathe 3.2s ease-in-out infinite; }
.animal-fox .animal-roam { animation: fox-stroll 18s ease-in-out infinite; }
.animal-fox .animal-body { animation: fox-step 1.8s ease-in-out infinite; }
.animal-deer .animal-body { animation: deer-rest 6s ease-in-out infinite; }
.garden-animal.says-hello .animal-body { animation: animal-hello .8s ease-in-out; }
.garden-animal.says-hello .animal-name { animation: animal-name 2.4s ease both; }
.garden-tip { position: absolute; bottom: calc(90px + env(safe-area-inset-bottom)); left: 24px; right: 130px; margin: 0; color: #596e5b; font-size: 10px; pointer-events: none; }
.open-garden-shop { position: absolute; right: max(22px, calc((100vw - 580px) / 2)); bottom: calc(104px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 5px; width: 76px; height: 80px; padding: 10px 6px; border: 1px solid #fff7d9bb; border-radius: 24px; background: #fff3dcd9; backdrop-filter: blur(12px); box-shadow: 0 7px 16px #65745a20; color: #4d6155; font-size: 11px; font-weight: 650; }
.open-garden-shop svg { width: 31px; height: 31px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.garden-invitation { position: absolute; top: 52%; left: 18%; right: 18%; text-align: center; color: #64735e; pointer-events: none; }
.invitation-line { display: block; width: 28px; height: 1px; background: #83906c88; margin: 0 auto 13px; }
.garden-invitation p { font-size: 15px; letter-spacing: .04em; margin: 0 0 7px; }
.garden-invitation small { font-size: 10px; }
.garden-shop { position: fixed; inset: auto 0 max(8px, env(safe-area-inset-bottom)); width: min(calc(100% - 16px), 600px); max-width: none; max-height: none; margin: 0 auto; padding: 0; border: 0; overflow: visible; background: transparent; color: var(--ink); }
.garden-shop::backdrop { background: #263b4d55; backdrop-filter: blur(5px); }
.shop-sheet { background: #fff9ef; border-radius: 28px; padding: 10px 20px 20px; height: auto; max-height: 79vh; max-height: min(79dvh, 720px); overflow: hidden; display: flex; flex-direction: column; overscroll-behavior: contain; box-shadow: 0 15px 70px #23394c33; }
.shop-grip { width: 32px; height: 4px; border-radius: 4px; background: #dacdc3; margin: 0 auto 16px; }
.garden-shop-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.garden-shop-header .eyebrow { font-size: 9px; letter-spacing: .12em; }
.garden-shop-header h2 { font-size: 21px; font-weight: 650; margin: 2px 0 0; }
.close-garden-shop { flex-shrink: 0; width: 40px; min-height: 40px; padding: 0; border: 0; border-radius: 50%; background: #efe7df; font-size: 25px; line-height: 1; color: #7a776e; }
.shop-balance { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 20px; margin: 12px 0 18px; }
.shop-balance > span:last-child { font-size: 11px; font-weight: 400; color: #8a8375; }
@keyframes rabbit-hop { 0%, 18%, 80%, 100% { transform: translate(0, 0); } 24% { transform: translate(9px, -12px); } 30% { transform: translate(18px, 0); } 36% { transform: translate(22px, -9px); } 42%, 72% { transform: translate(26px, 0); } }
@keyframes animal-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.025); } }
@keyframes fox-stroll { 0%, 100% { transform: translateX(-18px); } 50% { transform: translateX(20px); } }
@keyframes fox-step { 0%, 100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-3px) rotate(.5deg); } }
@keyframes deer-rest { 0%, 100% { transform: rotate(-1deg) scaleY(1); } 50% { transform: rotate(1deg) scaleY(1.015); } }
@keyframes animal-hello { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px) rotate(-3deg); } 65% { transform: translateY(0) rotate(2deg); } }
@keyframes animal-name { 0%, 100% { opacity: 0; } 12%, 80% { opacity: 1; } }
@media (max-width: 360px) {
  .shop-sheet { padding-inline: 14px; }
}
.shop-grip, .garden-shop-header, .shop-balance, .gacha-tabs { flex-shrink: 0; }
.shop-balance small { margin-left: auto; color: #8a8375; font-size: 11px; font-weight: 400; }
.gacha-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; margin-bottom: 10px; border-radius: 14px; background: #eee9df; }
.gacha-tabs button { min-height: 38px; border: 0; border-radius: 11px; font-size: 12px; background: transparent; color: #918572; }
.gacha-tabs button[aria-pressed='true'] { background: #fffdf7; color: #456353; font-weight: 650; box-shadow: 0 2px 5px #6c614710; }
.gacha-scroll { flex: 0 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 8px; }
.gacha-welcome, .gacha-result { text-align: center; padding: 12px 6px 4px; }
.gacha-welcome h3, .gacha-result h3 { margin: 10px 0 7px; font-size: 18px; font-weight: 650; }
.gacha-welcome p, .gacha-result p:not(.eyebrow) { margin: 0 0 10px; font-size: 11px; color: #8a8375; }
.gacha-result .eyebrow { color: #a2915b; font-size: 9px; letter-spacing: .18em; margin: 0; }
.draw-animal-image { display: block; width: 176px; height: 176px; object-fit: contain; margin: 0 auto; background: radial-gradient(ellipse, #e7eddc, transparent 70%); }
.gacha-capsule { position: relative; width: 114px; height: 114px; margin: 16px auto 23px; border-radius: 46% 46% 48% 48%; background: linear-gradient(150deg, #f8e6b5, #e3c99c 48%, #fffcf1 49%, #f5eee0 74%, #d7dbc9); border: 2px solid #fff9e5; box-shadow: inset -8px -7px 14px #7d88551a, 0 12px 22px #8c8c6818; transform: rotate(-12deg); }
.gacha-capsule::after { content: ''; position: absolute; width: 14px; height: 32px; left: 22px; top: 13px; border-radius: 60%; background: #fffaf080; transform: rotate(30deg); }
.gacha-capsule span { display: grid; place-items: center; height: 100%; font-size: 40px; font-weight: 550; color: #8e9777; transform: rotate(12deg); }
.gacha-controls { padding: 8px 3px 0; text-align: center; }
.gacha-controls .primary { min-height: 49px; font-size: 14px; padding: 10px; background: #3e6052; border-color: #3e6052; }
.animal-lineup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.lineup-card { display: flex; flex-direction: column; align-items: center; min-width: 0; border: 1px solid #e7dfd1; border-radius: 16px; padding: 8px 5px; background: #fffdf7; text-align: center; }
.lineup-card img, .unknown-animal { display: block; width: 100%; height: 83px; object-fit: contain; }
.lineup-name { display: block; min-height: 29px; font-size: 10px; line-height: 1.5; color: #506350; margin-top: 5px; overflow-wrap: anywhere; }
.lineup-card small { color: #a19b8b; font-size: 8px; margin-top: 4px; }
.lineup-card.locked { background: #eeeee4; border: 1px dashed #dcdccb; }
.locked .lineup-name { color: #a4a48f; }
.unknown-animal { display: grid; place-items: center; font-size: 35px; font-weight: 400; color: #c0c2ac; }
.lineup-detail { text-align: center; }
.lineup-detail img { width: min(100%, 260px); height: 250px; object-fit: contain; display: block; margin: 0 auto; }
.lineup-detail h3 { font-size: 19px; margin: 10px 0 7px; }
.lineup-detail p { font-size: 12px; color: #8a8375; }
.lineup-back { border: 0; background: none; color: #768369; display: block; min-height: 38px; padding: 5px; font-size: 12px; }
.garden-animal { --size: clamp(90px, 32vw, 160px); }
.many-residents .garden-animal { --size: clamp(66px, 25vw, 125px); }
.motion-hop .animal-roam { animation: rabbit-hop 10s ease-in-out infinite; }
.motion-stroll .animal-roam { animation: fox-stroll 18s ease-in-out infinite; }
.motion-rest .animal-body { animation: deer-rest 6s ease-in-out infinite; }
.motion-float .animal-body { animation: owl-float 4s ease-in-out infinite; }
.garden-animal .animal-body, .garden-animal .animal-roam { animation-delay: var(--delay, 0s); }
@keyframes owl-float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
@media (max-width: 360px) {
  .animal-lineup { gap: 6px; }
  .lineup-card { padding-inline: 3px; }
  .lineup-card img, .unknown-animal { height: 70px; }
  .draw-animal-image { width: 150px; height: 150px; }
}

.settings-heading { font-size: 17px; margin: 0 0 12px; font-weight: 650; }

.quiz-timer { position: sticky; top: 0; z-index: 3; margin: 12px 0 18px; padding: 12px 0; background: #fff9f3; box-shadow: 0 1px 0 var(--line); }
.timer-caption { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.timer-track { height: 8px; border-radius: 8px; background: #dde3ea; overflow: hidden; }
.timer-fill { height: 100%; background: #3484d6; transform-origin: left; transition: transform .1s linear; }
.timer-track[data-tone='yellow'] .timer-fill { background: #e9b52a; }
.timer-track[data-tone='red'] .timer-fill { background: #db4551; }
.result-badge.uncertain { color: #936c13; background: #fff0c5; }
.ratings button { min-width: 0; padding: 12px 4px; font-size: 13px; }
.history-question .catalog-prompt small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }

.history-question > summary { grid-template-columns: 20px minmax(0, 1fr) auto; align-items: start; }

.main-nav button span { white-space: nowrap; font-size: clamp(9px, 2.5vw, 10px); }

.start-countdown { min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.countdown-label { color: var(--muted); font-size: 14px; margin: 0; }
.countdown-number { margin: 12px 0; font-size: clamp(90px, 25vw, 140px); line-height: 1.5; font-weight: 750; color: var(--green); animation: countdown-pop .45s ease-out; }
.countdown-number.countdown-start { font-size: clamp(38px, 12vw, 64px); }
@keyframes countdown-pop {
  from { opacity: 0; transform: scale(.8); }
  to { opacity: 1; transform: scale(1); }
}

.quiz-active .main-nav { display: none; }
.quiz-active .shell { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
.quiz-active .question-head { margin-top: 0; }
.quiz-answer .question { font-size: 16px; font-weight: 500; line-height: 1.7; min-height: 0; margin: 10px 0 14px; }
.quiz-controls { flex-shrink: 0; margin-top: 12px; }
.quiz-controls[hidden] { display: none; }
.quiz-controls .ratings button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 76px; padding: 8px 3px; font-size: 13px; color: var(--ink); background: #fff9f3; }
.rating-symbol { font-size: 28px; line-height: 1.2; font-weight: 700; }
.rating-symbol.mistake { color: #ce3948; }
.rating-symbol.uncertain { color: #b88100; }
.rating-symbol.correct { color: #248153; }

.page-heading, .catalog-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.calendar-heading .page-title { font-size: clamp(20px, 5.5vw, 27px); white-space: nowrap; }
.calendar-heading .quiet { white-space: nowrap; font-size: 12px; padding: 8px 0; }
.catalog-toolbar .lesson-start { margin-left: auto; }

.history-heading .page-title { font-size: 24px; white-space: nowrap; }
.history-pagination { display: flex; align-items: center; gap: 3px; }
.history-pagination button { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; line-height: 1; background: #f4e4e3; border: 0; border-radius: 10px; font-size: 24px; }
.history-pagination span { min-width: 38px; text-align: center; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>

        toggle.dataset.scale = String(scale);
        image.style.width = `${scale}%`;
        slider.value = String(scale);
        toggle.querySelector('output').textContent = `${scale}%`;
        toggle.querySelector('[data-zoom="-25"]').disabled = scale === 50;
        toggle.querySelector('[data-zoom="25"]').disabled = scale === 300;
      }
      toggle.addEventListener('toggle', () => {
        if (!toggle.open) { image.removeAttribute('src'); return; }
        const url = toggle.dataset.sourceUrl;
        if (/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(url || '') || /^\.\/assets\/sources\/[a-f0-9]{64}-\d+\.png$/.test(url || '')) image.src = url;
      });
      slider.oninput = () => zoom(Number(slider.value));
      toggle.querySelectorAll('[data-zoom]').forEach(button => button.onclick = () => {
        const scale = button.dataset.zoom === 'reset' ? 100 : Number(toggle.dataset.scale) + Number(button.dataset.zoom);
        zoom(scale);
      });
    });
    setupGardenShop();
    slideDisclosures();
    content.querySelectorAll('[data-month]').forEach(button => button.onclick = () => {
      month = new Date(month.getFullYear(), month.getMonth() + Number(button.dataset.month), 1);
      selectedDay = RecallCore.day(month);
      render();
    });
    content.querySelectorAll('[data-day]').forEach(button => button.onclick = () => { selectedDay = button.dataset.day; render(); });
    const today = content.querySelector('[data-today]');
    if (today) today.onclick = () => { month = new Date(new Date().getFullYear(), new Date().getMonth(), 1); selectedDay = RecallCore.day(new Date()); render(); };
    setupSubjectPickers();
    content.querySelectorAll('[data-history-page]').forEach(button => button.onclick = () => {
      if (busy) return;
      historyPage = Number(button.dataset.historyPage);
      const url = new URL(location.href);
      url.searchParams.set('historyPage', String(historyPage));
      history.pushState(null, '', url);
      render();
    });
    content.querySelectorAll('[data-open-lesson]').forEach(button => button.onclick = () => catalogNavigate(button.dataset.openLesson));
    const back = content.querySelector('[data-catalog-back]');
    if (back) back.onclick = () => catalogNavigate();
    content.querySelectorAll('[data-retry-lesson]').forEach(button => button.onclick = () => {
      catalogErrors.delete(button.dataset.retryLesson);
      render();
    });
    content.querySelectorAll('[data-deck]').forEach(button => button.onclick = () => act('selectDeck', { id: button.dataset.deck }));
    content.querySelectorAll('[data-action]').forEach(b => b.onclick = () => act(b.dataset.action));
    if (page === 'quiz' && countdown === null) {
      quizTimer = setInterval(updateQuizTimer, 100);
      updateQuizTimer();
    }
    updateScrollFade();
    quizControls.querySelectorAll('[data-result]').forEach(b => b.onclick = () => act('rate', {
      eventId: `${state.session.id}:${state.session.index}`, result: b.dataset.result
    }));
  }
  scrollRegion.addEventListener('touchstart', startPull, { passive: true });
  scrollRegion.addEventListener('touchmove', movePull, { passive: false });
  scrollRegion.addEventListener('touchend', () => releasePull());
  scrollRegion.addEventListener('touchcancel', () => releasePull());
  scrollRegion.addEventListener('scroll', updateScrollFade, { passive: true });
  scrollRegion.addEventListener('toggle', updateScrollFade, true);
  window.addEventListener('resize', () => { releasePull(false); updateScrollFade(); });
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(updateScrollFade);
    observer.observe(scrollRegion);
    observer.observe(content);
  }
  document.querySelectorAll('[data-screen]').forEach(button => button.onclick = () => {
    if (busy) return;
    renderedKey = '';
    if (button.dataset.screen === 'quiz') { act('home'); return; }
    page = button.dataset.screen;
    if (page === 'catalog') catalogLesson = '';
    if (page === 'history') { historyPage = 1; catalogErrors.clear(); }
    if (page === 'calendar') {
      const today = new Date();
      month = new Date(today.getFullYear(), today.getMonth(), 1);
      selectedDay = RecallCore.day(today);
    }
    if (page === 'garden') {
      shopOpen = false;
      gachaView = 'draw';
      drawResult = null;
      lineupAnimal = null;
      shownDrawId = null;
    }
    status.textContent = '';
    render();
  });
  document.querySelector('#home').onclick = () => act('home');
  window.addEventListener('popstate', () => {
    if (busy) return;
    const params = new URLSearchParams(location.search);
    const requested = params.get('screen');
    page = ['garden', 'settings', 'calendar', 'catalog', 'history'].includes(requested) ? requested : 'quiz';
    catalogLesson = params.get('lesson') || '';
    historyPage = Math.max(1, parseInt(params.get('historyPage'), 10) || 1);
    subject = params.get('subject') || '';
    render();
  });
  document.querySelector('#settings-nav').onclick = () => { page = 'settings'; render(); };
  if (boot.notice) {
    const notice = document.querySelector('#notice'); notice.textContent = boot.notice; notice.hidden = false;
  }
  render();
})();

}).catch(RecallWeb.failure);</script>
</body>
</html>
